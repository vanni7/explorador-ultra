# Compila y prueba Explorador Ultra en las tres plataformas en cada push (SPEC §22).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 22.04",        os: ubuntu-22.04,   preset: release }
          - { name: "Ubuntu 24.04",        os: ubuntu-24.04,   preset: release }
          - { name: "Ubuntu 24.04 ASan+UBSan", os: ubuntu-24.04, preset: asan }
          - { name: "Windows (MSVC)",      os: windows-latest, preset: release }
          - { name: "macOS Intel",         os: macos-15-intel, preset: release }
          - { name: "macOS Apple Silicon", os: macos-15,       preset: release }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 \
            pkg-config libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            libarchive-dev libraw-dev libexiv2-dev libssl-dev

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Compilador MSVC en el PATH (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Qt (Linux y macOS)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Fase 3: reproducir en las miniaturas, PDF y más formatos de imagen.
          modules: 'qtmultimedia qtpdf qtimageformats'
          cache: true

      # aqtinstall (lo que usa install-qt-action) no encuentra Qt 6.12 para
      # Windows; se descarga con el guion propio. Ver docs/ENVIRONMENT.md.
      - name: Caché de Qt (Windows)
        if: runner.os == 'Windows'
        id: qt-windows-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt/${{ env.QT_VERSION }}
          key: qt-windows-${{ env.QT_VERSION }}-msvc2022_64-${{ hashFiles('tools/windows/fetch_qt_windows.py') }}

      - name: Descargar Qt (Windows)
        if: runner.os == 'Windows' && steps.qt-windows-cache.outputs.cache-hit != 'true'
        shell: bash
        run: python tools/windows/fetch_qt_windows.py "$RUNNER_TEMP/qt" "$QT_VERSION"

      - name: Rutas de Qt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          qt="$(cygpath -m "$RUNNER_TEMP")/qt/$QT_VERSION/msvc2022_64"
          echo "QT_ROOT_DIR=$qt" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$qt/bin")" >> "$GITHUB_PATH"

      # libarchive en Windows: con vcpkg, como en la VM (tools/windows/instalar-vcpkg.cmd).
      # Lo ya compilado se guarda en la caché y no se repite.
      - name: Caché de vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('tools/windows/instalar-vcpkg.cmd', 'tools/windows/vcpkg-triplets/*') }}

      - name: Bibliotecas de vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\vcpkg-cache" mkdir "%RUNNER_TEMP%\vcpkg-cache"
          set VCPKG_DEFAULT_BINARY_CACHE=%RUNNER_TEMP%\vcpkg-cache
          call tools\windows\instalar-vcpkg.cmd "%RUNNER_TEMP%\vcpkg" || exit /b 1
          echo EU_CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=%RUNNER_TEMP:\=/%/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release>> "%GITHUB_ENV%"

      - name: Configurar
        shell: bash
        run: EU_QT_DIR="$QT_ROOT_DIR" cmake --preset ${{ matrix.preset }} $EU_CMAKE_ARGS

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Pruebas
        run: ctest --preset ${{ matrix.preset }}
        env:
          # En Windows la CI es administradora: se prueba a instalar, usar y
          # quitar el servicio de NTFS de verdad (test_index_journal_service).
          EU_PRUEBA_INSTALAR_SERVICIO: "1"

      # Si una prueba falla sin dejar salida (el proceso murió de golpe), se
      # repite sola y con todo detalle: así queda el código de salida a la vista.
      # Lo que escribió cada prueba que falló (tests/CMakeLists.txt lo guarda
      # en un archivo además de en la salida).
      - name: Informes de las pruebas que fallaron
        if: failure()
        shell: bash
        run: |
          for log in build/${{ matrix.preset }}/test-logs/*.txt; do
            if grep -q -E "^FAIL!|^QFATAL|Totals: .* [1-9][0-9]* failed" "$log"; then
              echo "::group::$log"; cat "$log"; echo "::endgroup::"
            fi
          done

      - name: Repetir las pruebas fallidas con detalle
        if: failure()
        run: ctest --preset ${{ matrix.preset }} --rerun-failed --output-on-failure -VV

      - name: Arranque real de la aplicación (smoke test)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dir=build/${{ matrix.preset }}/bin
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$dir/explorador-ultra.app/Contents/MacOS/explorador-ultra" --smoke-test
          else
            "$dir/explorador-ultra" --smoke-test
          fi
